<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperScannerBot - VIP Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00ffcc;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .price-title {
            font-size: 0.9rem;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .price {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
        }
        ul {
            padding-left: 20px;
            font-size: 0.85rem;
            color: #cccccc;
            margin-bottom: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        .btn-paypal {
            display: block;
            background-color: #0070ba;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .vip-section {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
        }
        .btn-vip {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>SuperScannerBot Access</h1>

    <!-- 3 Months Access Card -->
    <div class="card">
        <div class="price-title">3 Months Access</div>
        <div class="price">$145 / 3mo</div>
        <ul>
            <li>Permanent VIP Dashboard Access</li>
            <li>All Future Software Updates</li>
            <li>Unlimited Signal Generation</li>
            <li>VIP Priority Support</li>
        </ul>
        <a href="https://www.paypal.com" target="_blank" class="btn-paypal">Pay with PayPal</a>
    </div>

    <!-- VIP Code Entry Card -->
    <div class="card">
        <div class="price-title">Have a VIP Code?</div>
        <div class="vip-section">
            <input type="text" placeholder="Enter VIP Code (e.g. Welco...)">
            <button class="btn-vip">Access Bot</button>
        </div>
    </div>

</body>
</html>
